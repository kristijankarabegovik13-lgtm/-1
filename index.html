<script>
(() => {
  'use strict';
  const videoId = 'g-OF7KGyDis';
  const frame = document.getElementById('youtube-player');
  const openButton = document.getElementById('open-invitation');
  const musicButton = document.getElementById('music-toggle');
  const musicLabel = document.getElementById('music-label');
  const status = document.getElementById('music-status');
  const motionButton = document.getElementById('motion-toggle');
  let player = null, ready = false, opened = false, wantsMusic = false, playing = false;
  let playbackCheck = null;
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const setStatus = text => { status.textContent = text; };
  const reflectPlayback = active => {
    playing = active;
    musicButton.setAttribute('aria-pressed', String(active));
    musicLabel.textContent = active ? 'Паузирај музика' : 'Пушти музика';
  };
  const tryPlay = () => {
    wantsMusic = true;
    if (ready && player) {
      player.unMute();
      player.setVolume(65);
      player.playVideo();
    } else {
      // A direct iframe command also works while the API is still loading.
      frame.contentWindow?.postMessage(JSON.stringify({event:'command',func:'playVideo',args:[]}), 'https://www.youtube.com');
    }
    setStatus('Се подготвува празничната музика…');
    clearTimeout(playbackCheck);
    playbackCheck = setTimeout(() => {
      if (!playing && wantsMusic) setStatus('Допрете ▶ на видеото за да започне песната.');
    }, 5500);
  };
  const params = new URLSearchParams({enablejsapi:'1',playsinline:'1',controls:'1',rel:'0',loop:'1',playlist:videoId,autoplay:'0'});
  if (/^https?:$/.test(location.protocol)) params.set('origin',location.origin);
  frame.src = `https://www.youtube.com/embed/${videoId}?${params}`;
  window.onYouTubeIframeAPIReady = () => {
    player = new YT.Player('youtube-player', {events:{
      onReady(event) {
        ready = true;
        event.target.setVolume(65);
        if (opened && wantsMusic) tryPlay();
      },
      onStateChange(event) {
        reflectPlayback(event.data === YT.PlayerState.PLAYING);
        if (event.data === YT.PlayerState.PLAYING) {
          clearTimeout(playbackCheck);
          setStatus('Празничната музика е вклучена.');
        } else if (event.data === YT.PlayerState.PAUSED) {
          wantsMusic = false;
          setStatus('Музиката е паузирана.');
        } else if (event.data === YT.PlayerState.ENDED && wantsMusic) {
          event.target.playVideo();
        }
      },
      onAutoplayBlocked() {
        reflectPlayback(false);
        setStatus('Допрете ▶ на видеото за да започне песната.');
      },
      onError() {
        reflectPlayback(false);
        setStatus('Песната не се вчита. Може да ја отворите на YouTube подолу.');
      }
    }});
  };
  const api = document.createElement('script');
  api.src = 'https://www.youtube.com/iframe_api';
  api.onerror = () => setStatus('Допрете ▶ на видеото или отворете ја песната на YouTube.');
  document.head.appendChild(api);
  openButton.addEventListener('click', () => {
    if (opened) return;
    opened = true;
    document.getElementById('content').inert = false;
    document.body.classList.add('opened');
    document.getElementById('intro').classList.add('is-closing');
    tryPlay(); // Keep this call within the visitor's tap for mobile browsers.
    setTimeout(() => {
      document.getElementById('intro').hidden = true;
      musicButton.focus({preventScroll:true});
    },900);
  });
  musicButton.addEventListener('click', () => {
    if (playing) {
      wantsMusic = false;
      if (ready) player.pauseVideo();
      else frame.contentWindow?.postMessage(JSON.stringify({event:'command',func:'pauseVideo',args:[]}), 'https://www.youtube.com');
      reflectPlayback(false);
      setStatus('Музиката е паузирана.');
    } else tryPlay();
  });
  motionButton.addEventListener('click', () => {
    const paused = document.body.classList.toggle('motion-paused');
    motionButton.setAttribute('aria-pressed',String(paused));
    document.getElementById('motion-label').textContent = paused ? 'Продолжи движење' : 'Паузирај движење';
  });
  if (reducedMotion.matches) {
    document.body.classList.add('motion-paused');
    motionButton.disabled = true;
    document.getElementById('motion-label').textContent = 'Мирен приказ';
  }
})();
